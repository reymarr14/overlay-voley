<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Overlay Vóley · Sporteros</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=Big+Shoulders+Display:wght@800;900&display=swap');
:root{--p:#604ee2;--c:#25c2ff;--g:#edeced;--ink:#16132e}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Antonio',Impact,sans-serif}
/* marcador */
.sb{position:absolute;left:48px;top:44px;width:660px;filter:drop-shadow(0 8px 18px #0007)}
.hd{background:var(--p);color:#fff;padding:9px 18px;font-size:22px;letter-spacing:.08em;display:flex;justify-content:space-between;border-radius:10px 10px 0 0}
.hd b{color:var(--c);font-weight:700}
.tm{display:flex;align-items:center;height:88px;background:var(--g);color:var(--ink);border-bottom:2px solid #16132e22}
.bar{width:12px;height:100%}
.lg{width:92px;height:88px;display:flex;align-items:center;justify-content:center}
.lg img{max-width:72px;max-height:72px;object-fit:contain}
.nm{flex:1;font-size:42px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.sv{width:16px;height:16px;border-radius:50%;background:var(--c);margin-right:10px;visibility:hidden}
.sv.on{visibility:visible;box-shadow:0 0 12px var(--c)}
.to{display:flex;flex-direction:column;gap:5px;margin-right:14px}
.to i{width:20px;height:6px;border-radius:3px;background:#16132e2a}.to i.u{background:var(--p)}
.st{display:flex;gap:6px;margin-right:16px}
.st b{width:22px;height:22px;border-radius:50%;border:3px solid var(--p)}.st b.w{background:var(--p)}
.pt{width:104px;height:100%;background:var(--ink);color:#fff;font:900 68px 'Big Shoulders Display',Impact,sans-serif;display:flex;align-items:center;justify-content:center}
.al{background:var(--c);color:var(--ink);font-size:26px;font-weight:700;letter-spacing:.06em;text-align:center;padding:6px;display:none}
.hs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hs span{background:var(--ink);color:#fff;font-size:22px;padding:4px 12px;border-radius:6px}
.hs b{color:var(--c);font-weight:700;margin-left:4px}
/* slider */
.sl{position:absolute;right:48px;top:44px;width:900px;height:506px;border-radius:14px;overflow:hidden;border:5px solid var(--p);background:var(--ink);filter:drop-shadow(0 8px 18px #0007)}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
.sl img.on{opacity:1}
.ch{position:absolute;border-radius:14px;overflow:hidden;border:5px solid var(--p);background:#16132ecc;display:none}
.ch iframe{width:100%;height:100%;border:0;background:transparent}
.bn{position:absolute;left:56px;top:690px;width:540px;padding:14px 20px;background:linear-gradient(90deg,var(--p),#3d8bff);color:#fff;border-radius:16px;border:4px solid #fff;font:700 44px/1.15 'Antonio',Impact,sans-serif;text-transform:uppercase;text-align:center;letter-spacing:.04em;filter:drop-shadow(0 8px 18px #0007);transform:translateX(-700px);opacity:0}
.bn small{display:table;margin:0 auto 8px;background:var(--ink);color:#fff;font-size:26px;letter-spacing:.12em;padding:3px 18px;border-radius:8px;text-shadow:none}
.bn .em{display:inline-block;animation:wig .6s ease-in-out 8}
.bn.go{animation:bn 6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes bn{0%{transform:translateX(-700px) scale(1);opacity:0}8%{transform:translateX(0) scale(1);opacity:1}12%{transform:translateX(0) scale(1.07)}16%{transform:translateX(0) scale(1)}88%{transform:translateX(0) scale(1);opacity:1}100%{transform:translateX(-700px) scale(1);opacity:0}}
@keyframes wig{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-18deg) scale(1.25)}75%{transform:rotate(18deg) scale(1.25)}}
.ad{position:absolute;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;border-radius:16px;border:5px solid #fff;background:linear-gradient(135deg,var(--p),#3d8bff);color:#fff;font:700 64px/1.1 'Antonio',Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;text-shadow:0 3px 8px #0006;filter:drop-shadow(0 8px 18px #0007)}
.cc{position:absolute;display:none;border:4px solid var(--p);border-radius:14px;overflow:hidden;filter:drop-shadow(0 8px 18px #0007)}
/* cámaras */
.cr{position:absolute;border-radius:50%;border:8px solid var(--p);box-shadow:0 0 0 4px var(--c),0 8px 18px #0007;background:var(--ink)}
.cn{position:absolute;transform:translateX(-50%);background:var(--p);color:#fff;font-size:26px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 20px;border-radius:20px;border:3px solid var(--c);white-space:nowrap}
.cn:empty{display:none}
.cg{position:absolute;border-radius:50%;border:3px dashed #fff;background:#ff2d5533;color:#fff;font-size:26px;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.3;text-shadow:0 2px 4px #000}
/* ticker */
.tk{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--ink);color:#fff;display:flex;align-items:center;border-top:4px solid var(--c)}
.tk .tag{background:var(--p);height:100%;padding:0 30px;display:flex;align-items:center;font-size:30px;letter-spacing:.08em;white-space:nowrap}
.tk .vp{flex:1;overflow:hidden;white-space:nowrap}
.tk .vp span{display:inline-block;font-size:34px;animation:mq 20s linear infinite}
@keyframes mq{from{transform:translateX(1700px)}to{transform:translateX(-100%)}}
/* panel */
html.pn{width:auto;height:auto;overflow:auto}
body.panel{width:auto;max-width:560px;margin:0 auto;height:auto;overflow:visible;min-height:100vh;background:#16132e;color:#edeced;font-family:system-ui,sans-serif;padding:14px}
.panel h1{font:700 22px 'Antonio',Impact;letter-spacing:.06em;margin-bottom:10px}
.panel h2{font:700 17px 'Antonio',Impact;letter-spacing:.06em;color:#25c2ff;margin-bottom:8px}
.panel .card{background:#211d42;border-radius:10px;padding:12px;margin-bottom:12px}
.panel label{display:block;font-size:12px;margin:6px 0 2px;opacity:.8}
.panel input[type=text],.panel input[type=number],.panel select{width:100%;padding:6px;border-radius:6px;border:1px solid #604ee2;background:#16132e;color:#fff}
.panel input[type=color]{width:100%;height:30px;border:0;background:none}
.panel .row{display:flex;gap:6px;margin-top:8px}
.panel button{flex:1;padding:9px 6px;border:0;border-radius:7px;background:#604ee2;color:#fff;font-weight:700;cursor:pointer}
.panel button.g{background:#3a3566}.panel button.r{background:#b3263e}
.panel .big{font:900 54px 'Big Shoulders Display',Impact;text-align:center;line-height:1}
.panel .big small{font-size:18px;display:block;font-family:system-ui;opacity:.7}
.panel .th{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.panel .th div{position:relative;width:64px;height:44px}
.panel .th img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.panel .th u{position:absolute;top:-4px;right:-4px;background:#b3263e;border-radius:50%;width:18px;height:18px;text-align:center;font-size:12px;line-height:18px;cursor:pointer;text-decoration:none}
.panel .chk{display:flex;gap:6px;align-items:center;margin-top:8px}
body.panel{padding:8px}.panel .card{margin-bottom:8px}.panel input[type=text],.panel input[type=number],.panel select{padding:5px}
.panel details.card{padding:0 10px}.panel details[open].card{padding-bottom:10px}
.panel summary{cursor:pointer;padding:10px 0;font:700 17px 'Antonio',Impact;letter-spacing:.06em;color:#25c2ff;list-style:none}
.panel summary::before{content:'▸ '}.panel details[open]>summary::before{content:'▾ '}
.panel .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.panel .fl{min-width:0}.panel input[type=file]{width:100%;font-size:12px}
.panel .th2{font:700 15px 'Antonio',Impact;letter-spacing:.06em}
.panel .pnm{font:700 16px 'Antonio',Impact;text-align:center;color:#a99dff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .pc .big{font-size:48px;margin:2px 0 6px}.panel .pc .g2{gap:6px}.panel .pc button{padding:9px 4px}.panel button.bp{padding:14px 4px;font-size:15px}
</style></head>
<body>
<div id="stage">
  <div class="sb" id="sb"><div class="hd"><span id="h1"></span><b id="h2"></b></div>
    <div id="ra"></div><div id="rb"></div><div class="al" id="al"></div><div class="hs" id="hs"></div></div>
  <div class="sl" id="sl"><img id="i0"><img id="i1"></div>
  <div class="ch" id="ch"><iframe id="cf"></iframe></div>
  <div id="cams"></div>
  <div class="bn" id="bn"></div>
  <div class="ad" id="ad"></div>
  <div class="cc" id="cc"></div>
  <div class="tk" id="tk"><span class="tag" id="tg"></span><div class="vp"><span id="tt"></span></div></div>
</div>
<script>
const $=s=>document.querySelector(s),K='sporteros_voley_v1',P=/panel/.test(location.search);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const courtSVG=k=>`<svg id="${k}court" viewBox="-1.5 -2.5 21 12.5" style="display:block;width:100%;${k==='p'?'cursor:crosshair':''}">
<rect x="-1.5" y="-2.5" width="21" height="12.5" fill="#16132e"/>
<rect id="${k}c1" x="0" y="-1.05" width="8.4" height=".28" fill="#604ee2"/><rect id="${k}c2" x="9.6" y="-1.05" width="8.4" height=".28" fill="#25c2ff"/>
<text id="${k}n1" x="4.2" y="-1.4" text-anchor="middle" fill="#fff" font-size="1.15" font-family="Antonio,Impact,sans-serif" font-weight="700"></text>
<text id="${k}n2" x="13.8" y="-1.4" text-anchor="middle" fill="#fff" font-size="1.15" font-family="Antonio,Impact,sans-serif" font-weight="700"></text>
<rect x="0" y="0" width="18" height="9" fill="#3a2f9e"/><rect x="6" y="0" width="6" height="9" fill="#5a4cd8"/>
<path d="M0 0H18V9H0Z M6 0V9 M12 0V9" fill="none" stroke="#fff" stroke-width=".12"/>
<path d="M9 -.5V9.5" stroke="#25c2ff" stroke-width=".3"/>
<path id="${k}tp" fill="none" stroke="#25c2ff" stroke-width=".16" stroke-dasharray=".5 .3" stroke-linecap="round"/>
<g id="${k}td" fill="#25c2ff" opacity=".7"></g>
<g id="${k}bl" style="transform:translate(9px,4.5px);transition:transform .55s cubic-bezier(.3,.8,.3,1);display:none"><circle r=".75" fill="#fff" opacity=".25"/><text font-size="1.3" text-anchor="middle" dominant-baseline="central">🏐</text></g></svg>`;
function paintCourt(k){const bl=$('#'+k+'bl');if(!bl)return;const t=S.trail||[],l=t[t.length-1];
  if(l)bl.style.transform=`translate(${l.x}px,${l.y}px)`;bl.style.display=l?'':'none';
  $('#'+k+'tp').setAttribute('d',t.length>1?'M'+t.map(q=>q.x+' '+q.y).join('L'):'');
  $('#'+k+'td').innerHTML=t.slice(0,-1).map(q=>`<circle cx="${q.x}" cy="${q.y}" r=".25"/>`).join('');
  $('#'+k+'n1').textContent=(S.a.short||S.a.name).toUpperCase().slice(0,14);$('#'+k+'n2').textContent=(S.b.short||S.b.name).toUpperCase().slice(0,14);
  $('#'+k+'c1').setAttribute('fill',S.a.color);$('#'+k+'c2').setAttribute('fill',S.b.color)}
const T=(n,c)=>({name:n,short:'',color:c,logo:'',pts:0,sets:0,to:2});
const D=()=>({a:T('Equipo A','#604ee2'),b:T('Equipo B','#25c2ff'),serve:'',hist:[],bestOf:5,
  title:'LIGA PERUANA DE VÓLEY',sub:'Jornada 1',ticker:'Sigue el partido en vivo con Sporteros',tag:'SPORTEROS',
  showScore:true,showTicker:true,showSlider:true,interval:6,photos:[],
  showCams:true,guide:false,cams:[{name:'Narrador 1',x:60,y:400,d:240},{name:'Narrador 2',x:340,y:400,d:240}],
  sliderW:900,showChat:false,chatUrl:'',chat:{x:1392,y:580,w:480,h:380},showAnim:true,ev:null,showAd:false,adText:'Anuncia tu marca aquí',adH:200,trail:[],showCourt:true,court:{x:590,y:776,w:380},v:3});
const load=()=>{try{const s=JSON.parse(localStorage.getItem(K)||'{}');if((s.v||0)<2)s.cams=D().cams;if((s.v||0)<3){s.chat=D().chat;s.sliderW=900}s.v=3;return{...D(),...s}}catch{return D()}};
let S=load(),U=[],bc=new BroadcastChannel(K);
const other=t=>t==='a'?'b':'a',need=()=>Math.ceil(S.bestOf/2),
  decider=()=>S.a.sets+S.b.sets===S.bestOf-1,target=()=>decider()?15:25;
function save(){try{localStorage.setItem(K,JSON.stringify(S));bc.postMessage(1);return true}
  catch{alert('Almacenamiento lleno: quita algunas fotos.');return false}}
const sync=()=>{S=load();draw();P&&upd()};
addEventListener('storage',e=>e.key===K&&sync());bc.onmessage=sync;

/* ---------- lógica ---------- */
const snap=()=>{U.push(JSON.stringify({a:[S.a.pts,S.a.sets,S.a.to],b:[S.b.pts,S.b.sets,S.b.to],serve:S.serve,hist:S.hist}));U.length>60&&U.shift()};
function undo(){const x=U.pop();if(!x)return;const o=JSON.parse(x);
  [['a',o.a],['b',o.b]].forEach(([t,v])=>[S[t].pts,S[t].sets,S[t].to]=v);S.serve=o.serve;S.hist=o.hist;done()}
function pt(t,d){snap();const o=S[t],p=S[other(t)],g=target();o.pts=Math.max(0,o.pts+d);
  if(d>0){S.serve=t;if(o.pts>=g&&o.pts-p.pts>=2){S.hist.push([S.a.pts,S.b.pts]);o.sets++;S.a.pts=S.b.pts=0;S.a.to=S.b.to=2;S.ev={id:Date.now(),type:o.sets>=need()?'match':'set',team:t}}}done()}
function setS(t,d){snap();S[t].sets=Math.max(0,S[t].sets+d);done()}
function useTo(t){snap();S[t].to=Math.max(0,S[t].to-1);done()}
function done(){save();draw();P&&upd()}
function alertOf(t){const o=S[t],p=S[other(t)];
  if(o.pts+1>=target()&&o.pts+1-p.pts>=2)return o.sets+1===need()?'PUNTO DE PARTIDO':'PUNTO DE SET'}

/* ---------- overlay ---------- */
const row=t=>{const o=S[t];return`<div class="tm"><div class="bar" style="background:${o.color}"></div>
<div class="lg">${o.logo?`<img src="${esc(o.logo)}" onerror="this.style.display='none'">`:''}</div><div class="nm">${esc(o.name)}</div>
<div class="sv ${S.serve===t?'on':''}"></div>
<div class="to">${[0,1].map(i=>`<i class="${i<o.to?'u':''}"></i>`).join('')}</div>
<div class="st">${Array.from({length:need()},(_,i)=>`<b class="${i<o.sets?'w':''}"></b>`).join('')}</div>
<div class="pt">${o.pts}</div></div>`};
let sig='',idx=0,cur=0,timer,lastTick='',evInit=false,lastEv=null;
function play(e){const o=S[e.team],m=e.type==='match',L=['🏐','🔥','💥','👏'],W=['🏆','🎉','👑'],
  em=(m?W:L)[Math.floor(Math.random()*(m?W:L).length)],h=S.hist[S.hist.length-1]||[0,0],b=$('#bn');
  b.innerHTML=`<small>${m?'FINAL DEL PARTIDO · '+S.a.sets+'–'+S.b.sets+' EN SETS':'SET '+S.hist.length+' · '+h[0]+'–'+h[1]}</small>${m?'¡PARTIDO PARA':'SET PARA'} ${esc(o.name)}${m?'!':''} <span class="em">${em}</span>`;
  b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}
function draw(){if(P||!$('#sb'))return;
  $('#sb').style.display=S.showScore?'':'none';
  $('#h1').textContent=S.title;$('#h2').textContent=S.sub;
  $('#ra').innerHTML=row('a');$('#rb').innerHTML=row('b');
  const al=['a','b'].map(t=>{const k=alertOf(t);return k&&`${k} · ${S[t].short||S[t].name}`}).filter(Boolean).join('   |   ');
  $('#al').style.display=al?'block':'none';$('#al').textContent=al;
  $('#hs').innerHTML=S.hist.map((h,i)=>`<span>SET ${i+1}<b>${h[0]}–${h[1]}</b></span>`).join('');
  $('#cams').innerHTML=S.cams.map((c,i)=>(S.showCams?`<div class="cr" style="left:${c.x-8}px;top:${c.y-8}px;width:${c.d+16}px;height:${c.d+16}px"></div>
    <div class="cn" style="left:${c.x+c.d/2}px;top:${c.y+c.d-10}px">${esc(c.name)}</div>`:'')+
    (S.guide||/guide/.test(location.search)?`<div class="cg" style="left:${c.x}px;top:${c.y}px;width:${c.d}px;height:${c.d}px">CÁMARA ${i+1}<br>${c.d}×${c.d}<br>X ${c.x} · Y ${c.y}</div>`:'')).join('');
  const e=S.ev;if(!evInit){evInit=true;lastEv=e?.id}else if(e&&e.id!==lastEv){lastEv=e.id;S.showAnim&&play(e)}
  $('#tk').style.display=S.showTicker&&S.ticker?'':'none';$('#tg').textContent=S.tag;
  if(lastTick!==S.ticker){lastTick=S.ticker;const s=$('#tt');s.textContent=S.ticker;
    s.style.animationDuration=Math.max(12,(1700+S.ticker.length*18)/140)+'s'}
  $('#sl').style.display=S.showSlider&&S.photos.length?'':'none';
  $('#sl').style.width=S.sliderW+'px';$('#sl').style.height=Math.round(S.sliderW*9/16)+'px';
  const ad=$('#ad');ad.style.display=S.showAd?'flex':'none';ad.textContent=S.adText;
  Object.assign(ad.style,{right:'48px',width:S.sliderW+'px',height:S.adH+'px',top:(44+Math.round(S.sliderW*9/16)+20)+'px'});
  const cc=$('#cc');cc.style.display=S.showCourt?'block':'none';Object.assign(cc.style,{left:S.court.x+'px',top:S.court.y+'px',width:S.court.w+'px'});paintCourt('o');
  const cu=S.showChat&&S.chatUrl&&!S.showAd,c=S.chat,cf=$('#cf');$('#ch').style.display=cu?'block':'none';
  Object.assign($('#ch').style,{left:c.x+'px',top:c.y+'px',width:c.w+'px',height:c.h+'px'});
  if(cu&&cf.dataset.u!==S.chatUrl){cf.dataset.u=S.chatUrl;cf.src=S.chatUrl}
  const ns=S.photos.length+'|'+S.interval+'|'+(S.photos[0]||'').length;
  if(ns!==sig){sig=ns;clearInterval(timer);idx=0;if(S.photos.length){$('#i0').src=S.photos[0];$('#i0').className='on';$('#i1').className='';cur=0;
    timer=setInterval(()=>{if(S.photos.length<2)return;idx=(idx+1)%S.photos.length;const n=cur^1;
      $('#i'+n).src=S.photos[idx];$('#i'+n).className='on';$('#i'+cur).className='';cur=n},Math.max(2,S.interval)*1000)}}}

/* ---------- panel ---------- */
const get=p=>p.split('.').reduce((o,k)=>o?.[k],S);
function setp(p,v){const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v}
const f=(l,p,t='text')=>`<div class="fl"><label>${l}</label><input data-p="${p}" type="${t}" value="${esc(get(p))}"></div>`;
const chk=(l,p)=>`<div class="chk"><input type="checkbox" data-p="${p}" ${get(p)?'checked':''}> ${l}</div>`;
const UI=(()=>{try{return JSON.parse(localStorage.getItem('sporteros_voley_ui')||'{}')}catch{return{}}})(),OPEN={eq:1,pt:1,ca:1};
const sec=(id,t,b)=>`<details class="card" data-s="${id}" ${(UI[id]??OPEN[id])?'open':''}><summary>${t}</summary>${b}</details>`;
const teamCfg=t=>`<div><div class="th2" style="color:${t==='a'?'#a99dff':'#25c2ff'}">EQUIPO ${t.toUpperCase()}</div>${f('Nombre',t+'.name')}${f('Sigla (alertas)',t+'.short')}${f('Color de barra',t+'.color','color')}${f('URL del logo (PNG transparente)',t+'.logo')}</div>`;
const ptCol=t=>`<div class="pc"><div class="pnm" id="n${t}"></div><div class="big"><span id="p${t}"></span><small id="q${t}"></small></div>
<div class="g2"><button data-a="pt:${t}:-1" class="g">−1</button><button data-a="pt:${t}:1" class="bp">+1 punto</button>
<button data-a="set:${t}:-1" class="g">− set</button><button data-a="set:${t}:1" class="g">+ set</button>
<button data-a="to:${t}" class="g">T.O. <span id="t${t}"></span></button><button data-a="sv:${t}" class="g">Saque</button></div></div>`;
const hint=x=>`<div class="row"><small style="opacity:.7">${x}</small></div>`;
function build(){document.documentElement.className='pn';document.body.className='panel';document.body.innerHTML=`<h1>PANEL · OVERLAY VÓLEY</h1>
${sec('eq','EQUIPOS',`<div class="g2">${teamCfg('a')}${teamCfg('b')}</div>`)}
${sec('pt','PUNTOS',`<div class="g2">${ptCol('a')}${ptCol('b')}</div>
<div class="row"><button data-a="undo" class="g">Deshacer (Z)</button><button data-a="zero" class="g">Puntos a 0</button><button data-a="new" class="r">Nuevo partido</button></div>
${hint('Atajos: 1 / 2 suman punto · Q / W restan · Z deshace')}`)}
${sec('ca','CAMPO · TRAYECTORIA DEL BALÓN',`<div style="border-radius:8px;overflow:hidden">${courtSVG('p')}</div>
${hint('Haz clic donde esté el balón: se mueve y deja la ruta de los últimos 6 toques. Clic fuera de la cancha = balón fuera.')}
<div class="row"><button data-a="court:x" id="cb"></button><button data-a="cu:x" class="g">Deshacer toque</button><button data-a="cc:x" class="g">Limpiar ruta</button></div>
<div class="g3">${f('X (px)','court.x','number')}${f('Y (px)','court.y','number')}${f('Ancho (px)','court.w','number')}</div>`)}
${sec('pa','CONFIGURACIÓN DEL PARTIDO',`${f('Título','title')}${f('Subtítulo (jornada, sede…)','sub')}
<div class="fl"><label>Formato</label><select data-p="bestOf"><option value="5">Al mejor de 5 (set 5 a 15)</option><option value="3">Al mejor de 3 (set 3 a 15)</option></select></div>
${chk('Mostrar marcador','showScore')}`)}
${sec('sl','SLIDER DE FOTOS',`<label>Agregar fotos</label><input type="file" accept="image/*" multiple id="ph">
<div class="g2">${f('Segundos por foto','interval','number')}${f('Ancho (px, alto 16:9)','sliderW','number')}</div>${chk('Mostrar slider','showSlider')}<div class="th" id="th"></div>`)}
${sec('ad','RECUADRO DE PUBLICIDAD',`<div class="row"><button data-a="ad:x" id="adb"></button></div>
${f('Texto','adText')}${f('Alto (px)','adH','number')}${hint('Va bajo el slider, del mismo ancho. Mientras está visible, el chat se oculta. Atajo: P')}`)}
${sec('an','ANIMACIÓN DE SET / PARTIDO',`${chk('Mostrar animación al ganar set o partido','showAnim')}
<div class="g2" style="margin-top:8px"><button data-a="demo:a:set" class="g">Probar set A</button><button data-a="demo:b:set" class="g">Probar set B</button><button data-a="demo:a:match" class="g">Probar partido A</button><button data-a="demo:b:match" class="g">Probar partido B</button></div>`)}
${sec('ch','CHAT EN PANTALLA',`${chk('Mostrar chat','showChat')}${f('URL del chat (overlay de Social Stream, etc.)','chatUrl')}
<div class="g2">${f('X (px)','chat.x','number')}${f('Y (px)','chat.y','number')}${f('Ancho (px)','chat.w','number')}${f('Alto (px)','chat.h','number')}</div>`)}
${sec('cm','CÁMARAS DE NARRADORES',`${chk('Mostrar marcos','showCams')}${chk('Mostrar guía de posición (desactívala al salir en vivo)','guide')}
${[0,1].map(i=>f('Cámara '+(i+1)+' · nombre','cams.'+i+'.name')+`<div class="g3">${f('X','cams.'+i+'.x','number')}${f('Y','cams.'+i+'.y','number')}${f('Diámetro','cams.'+i+'.d','number')}</div>`).join('')}`)}
${sec('ti','CINTA INFERIOR',`${f('Etiqueta','tag')}${f('Texto','ticker')}${chk('Mostrar cinta','showTicker')}`)}`;
  document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.s){UI[d.dataset.s]=d.open?1:0;try{localStorage.setItem('sporteros_voley_ui',JSON.stringify(UI))}catch{}}},true);
  $('[data-p=bestOf]').value=S.bestOf;upd();thumbs()}
function upd(){paintCourt('p');$('#cb').textContent=S.showCourt?'Ocultar campo':'Mostrar campo';$('#adb').textContent=S.showAd?'Ocultar recuadro de publicidad':'Mostrar recuadro de publicidad';['a','b'].forEach(t=>{$('#n'+t).textContent=S[t].name;$('#p'+t).textContent=S[t].pts;
  $('#q'+t).textContent='sets '+S[t].sets+(S.serve===t?' · saque':'');$('#t'+t).textContent='('+S[t].to+')'})}
function thumbs(){$('#th').innerHTML=S.photos.map((s,i)=>`<div><img src="${s}"><u data-del="${i}">✕</u></div>`).join('')}
async function img(file,max,type){const b=await createImageBitmap(file),r=Math.min(1,max/Math.max(b.width,b.height)),
  c=document.createElement('canvas');c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);
  c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL(type,.78)}
if(!P)$('#cc').innerHTML=courtSVG('o');
if(P){build();
  document.addEventListener('click',e=>{const sv=e.target.closest('#pcourt');if(sv){const q=sv.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const m=q.matrixTransform(sv.getScreenCTM().inverse()),cl=(v,a,b)=>Math.round(Math.max(a,Math.min(b,v))*100)/100;S.trail.push({x:cl(m.x,-1.2,19.2),y:cl(m.y,-.7,9.7)});S.trail.length>6&&S.trail.shift();done();return}const d=e.target.dataset;
    if(d.del!==undefined){S.photos.splice(+d.del,1);save();thumbs();return}
    if(!d.a)return;const[a,t,v]=d.a.split(':');
    if(a==='pt')pt(t,+v);else if(a==='set')setS(t,+v);else if(a==='to')useTo(t);else if(a==='ad'){S.showAd=!S.showAd;done()}else if(a==='court'){S.showCourt=!S.showCourt;done()}else if(a==='cu'){S.trail.pop();done()}else if(a==='cc'){S.trail=[];done()}else if(a==='demo'){S.ev={id:Date.now(),type:v,team:t};save();draw()}
    else if(a==='sv'){snap();S.serve=t;done()}else if(a==='undo')undo();
    else if(a==='zero'){snap();S.a.pts=S.b.pts=0;done()}
    else if(a==='new'&&confirm('¿Reiniciar todo el marcador?')){snap();S.a.pts=S.b.pts=S.a.sets=S.b.sets=0;S.a.to=S.b.to=2;S.hist=[];S.serve='';done()}});
  document.addEventListener('change',async e=>{const el=e.target;
    if(el.dataset.p){setp(el.dataset.p,el.type==='checkbox'?el.checked:el.type==='number'||el.dataset.p==='bestOf'?+el.value:el.value);done()}
    else if(el.dataset.logo&&el.files[0]){S[el.dataset.logo].logo=await img(el.files[0],256,'image/png');done()}
    else if(el.id==='ph'){for(const fl of el.files)S.photos.push(await img(fl,960,'image/jpeg'));
      save()||S.photos.splice(-el.files.length);el.value='';thumbs();draw()}});
  addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;
    const m={1:['a',1],2:['b',1],q:['a',-1],w:['b',-1]}[e.key.toLowerCase()];
    if(m)pt(...m);else if(e.key.toLowerCase()==='z')undo();else if(e.key.toLowerCase()==='p'){S.showAd=!S.showAd;done()}})}
else draw();
</script></body></html>
